[project]
name = "network-route-optimization"
version = "0.1.0"
description = "Minimum-latency routes through a directed network"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["alembic>=1.13.2", "fastapi>=0.115.0", "pydantic-settings>=2.6.0", "psycopg[binary]>=3.2.3", "sqlalchemy>=2.0.36", "uvicorn[standard]>=0.32.1"]

[dependency-groups]
dev = ["httpx>=0.27.2", "pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
