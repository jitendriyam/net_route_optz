services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: network_route_optimization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d network_route_optimization"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/network_route_optimization
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:8000"

volumes:
  postgres_data:
